# Everything this build runs: no key here is rejected as not supported yet.
system: docker-compose.yml

traffic:
  image: grafana/k6:1.0.0
  command: [run, /load/traffic.js]
  volumes: [./load:/load:ro]
  environment: { FLOW: checkout }

edges:
  traffic -> checkout: tcp
  checkout -> payments: tcp
  checkout -> postgres: tcp

connections:
  postgres: postgres://postgres:dev@postgres/shop

scenarios:
  no-faults: {}
  slow-payments:
    faults:
      - { name: slow-pay, edge: checkout -> payments, fault: latency, delay: 300ms, jitter: 50ms, after: 20s, for: 30s }
  db-blip:
    duration: 90s
    env: { traffic: { RATE: "50" } }
    faults:
      - { edge: checkout -> postgres, fault: down, after: 20s, for: 15s }
    checks:
      - sql: { on: postgres, query: "select count(*) from checkout.orders where status = 'pending'", expect: 0 }

checks:
  - image: ghcr.io/zugzwang-io/kazu-python:1
    volumes: [./checks:/checks:ro]
  - sql: { on: postgres, query: "select order_id from payments.charges group by order_id having count(*) > 1", expect: empty }

suites:
  pr: [slow-payments, db-blip]
  release: all
