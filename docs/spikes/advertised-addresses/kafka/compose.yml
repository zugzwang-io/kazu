# Three KRaft brokers; ADV_PREFIX picks what each advertises: kafka-N (names) or 10.77.0.1N (IPs).
x-broker: &broker
  image: apache/kafka:3.8.0
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 3s
    retries: 40
x-env: &env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
x-proxy: &proxy
  image: kazu-spike-proxy
  pull_policy: never
services:
  kafka-1: { <<: *broker, networks: { core: { ipv4_address: 10.77.0.11 } }, environment: { <<: *env, KAFKA_NODE_ID: 1, KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://${ADV_PREFIX}1:9092" } }
  kafka-2: { <<: *broker, networks: { core: { ipv4_address: 10.77.0.12 } }, environment: { <<: *env, KAFKA_NODE_ID: 2, KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://${ADV_PREFIX}2:9092" } }
  kafka-3: { <<: *broker, networks: { core: { ipv4_address: 10.77.0.13 } }, environment: { <<: *env, KAFKA_NODE_ID: 3, KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://${ADV_PREFIX}3:9092" } }
  px-1: { <<: *proxy, command: [proxy, -listen, ":9092", -upstream, "kafka-1:9092"], networks: { core: {}, edge: { ipv4_address: 10.77.1.11 } } }
  px-2: { <<: *proxy, command: [proxy, -listen, ":9092", -upstream, "kafka-2:9092"], networks: { core: {}, edge: { ipv4_address: 10.77.1.12 } } }
  px-3: { <<: *proxy, command: [proxy, -listen, ":9092", -upstream, "kafka-3:9092"], networks: { core: {}, edge: { ipv4_address: 10.77.1.13 } } }
  client:
    image: apache/kafka:3.8.0
    entrypoint: ["sleep", "infinity"]
    volumes: [./workload.sh:/workload.sh:ro]
    networks: [edge]
    extra_hosts: ["kafka-1:10.77.1.11", "kafka-2:10.77.1.12", "kafka-3:10.77.1.13"]
networks:
  core: { ipam: { config: [{ subnet: 10.77.0.0/24 }] } }
  edge: { internal: true, ipam: { config: [{ subnet: 10.77.1.0/24 }] } }
