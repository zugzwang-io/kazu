# Three cluster primaries; ENDPOINT picks what MOVED redirects and CLUSTER SHARDS hand out: hostname or ip.
x-node: &node
  image: redis:7.4
  networks: [core]
  healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 20 }
x-proxy: &proxy
  image: kazu-spike-proxy
  pull_policy: never
services:
  redis-1: { <<: *node, command: [redis-server, --cluster-enabled, "yes", --cluster-announce-hostname, redis-1, --cluster-preferred-endpoint-type, "${ENDPOINT}"] }
  redis-2: { <<: *node, command: [redis-server, --cluster-enabled, "yes", --cluster-announce-hostname, redis-2, --cluster-preferred-endpoint-type, "${ENDPOINT}"] }
  redis-3: { <<: *node, command: [redis-server, --cluster-enabled, "yes", --cluster-announce-hostname, redis-3, --cluster-preferred-endpoint-type, "${ENDPOINT}"] }
  init:
    image: redis:7.4
    networks: [core]
    depends_on: { redis-1: { condition: service_healthy }, redis-2: { condition: service_healthy }, redis-3: { condition: service_healthy } }
    entrypoint: ["sh", "-c"]
    command:
      - >-
        redis-cli --cluster create redis-1:6379 redis-2:6379 redis-3:6379 --cluster-yes >/dev/null &&
        for n in 1 2 3; do until redis-cli -h redis-$$n cluster info | grep -q cluster_state:ok; do sleep 1; done; done
  px-1: { <<: *proxy, command: [proxy, -listen, ":6379", -upstream, "redis-1:6379"], networks: { core: {}, edge: { ipv4_address: 10.77.1.11 } } }
  px-2: { <<: *proxy, command: [proxy, -listen, ":6379", -upstream, "redis-2:6379"], networks: { core: {}, edge: { ipv4_address: 10.77.1.12 } } }
  px-3: { <<: *proxy, command: [proxy, -listen, ":6379", -upstream, "redis-3:6379"], networks: { core: {}, edge: { ipv4_address: 10.77.1.13 } } }
  client:
    image: redis:7.4
    entrypoint: ["sleep", "infinity"]
    volumes: [./workload.sh:/workload.sh:ro]
    networks: [edge]
    extra_hosts: ["redis-1:10.77.1.11", "redis-2:10.77.1.12", "redis-3:10.77.1.13"]
networks:
  core: {}
  edge: { internal: true, ipam: { config: [{ subnet: 10.77.1.0/24 }] } }
