# Runs on every PR. The bench job does its work only when the proxy, the root
# module's dependencies or this file changed, and reports as skipped
# otherwise. The gate is per job rather than a workflow-level paths filter so
# the job always reports a status and could become a required check.
#
# Advisory: benchmarks the proxy on the PR's base and head and posts a
# benchstat comparison to the job summary. Numbers never fail the PR, only a
# benchmark that doesn't build, run or finish does. Base and head runs
# alternate so drift on the runner hits both alike.
name: pr-bench

on:
  pull_request:

jobs:
  changes:
    name: bench changes
    runs-on: ubuntu-latest
    outputs:
      proxy: ${{ steps.filter.outputs.proxy }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            proxy:
              - 'proxy/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/pr-bench.yml'

  bench:
    name: bench
    needs: changes
    if: needs.changes.outputs.proxy == 'true'
    runs-on: ubuntu-latest
    steps:
      # Without a ref this is the PR's merge commit with its base, not the
      # branch tip: the change as it would land.
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-go@v5
        with:
          go-version-file: head/go.mod
          cache: false
      - run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260209182753-b57e4e371b65
      - name: Benchmark base and head
        # Named explicitly so bash runs with pipefail and a failing go test
        # isn't hidden behind tee.
        shell: bash
        run: |
          dirs="base head"
          if ! grep -qs '^func Benchmark' base/proxy/*_test.go; then
            dirs="head"
          fi
          for _ in 1 2 3 4 5 6; do
            for d in $dirs; do
              (cd "$d" && go test -run NONE -bench . -count 1 -timeout 2m ./proxy/) | tee -a "$d.txt"
            done
          done
          {
            if [ "$dirs" = head ]; then
              echo "The base has no proxy benchmarks, so there is no base vs head comparison."
            else
              echo "### Base vs head"
              echo '```'
              benchstat base=base.txt head=head.txt
              echo '```'
            fi
            echo "### Head: direct vs proxied"
            echo '```'
            benchstat -col /path head.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
