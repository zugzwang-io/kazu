# Lints every Go module in the repo with the root .golangci.yml.
name: lint

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          install-only: true
      - name: Lint each module
        run: |
          fail=0
          for mod in $(git ls-files '*go.mod'); do
            dir=$(dirname "$mod")
            echo "::group::$dir"
            (cd "$dir" && golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml" ./...) || fail=1
            echo "::endgroup::"
          done
          exit $fail
