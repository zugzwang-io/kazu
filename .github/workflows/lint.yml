# Lints each Go module with the root .golangci.yml (golangci-lint finds it by
# walking up from the module). A new module adds itself to the matrix.
name: lint

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ["."]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: ${{ matrix.module }}
