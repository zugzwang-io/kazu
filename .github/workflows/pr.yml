# Everything that runs on a PR into main, and so everything that must pass
# before it merges. One file per trigger: add new checks here as jobs.
name: pr

on:
  pull_request:
    branches: [main]

jobs:
  # golangci-lint with the root .golangci.yml, once per Go module (it finds
  # the config by walking up). A new module adds itself to the matrix.
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", examples/shop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: ${{ matrix.module }}

  shop-test:
    name: shop test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/shop/go.mod
          cache: false
      - run: go test -race -count=1 ./...

  # Every shop service's Dockerfile builds. Whether the images run is checked
  # by compose, once the whole system is in.
  shop-images:
    name: shop images
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/shop
    steps:
      - uses: actions/checkout@v4
      - name: Build every service image
        run: |
          for f in services/*/Dockerfile; do
            svc=$(basename "$(dirname "$f")")
            echo "::group::$svc"
            docker build -f "$f" -t "shop-$svc" . || { echo "::error title=docker build::$svc failed"; exit 1; }
            echo "::endgroup::"
          done
