# Spike only (branch spike-network, never merged): proves the host reaches a
# sealed trial network through one in-network helper container.
name: spike-network

on:
  push:
    branches: [spike-network]
  workflow_dispatch:

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          echo "### $(docker version --format 'docker {{.Server.Version}}'), $(docker compose version --short)" >> "$GITHUB_STEP_SUMMARY"
      - name: Run 1 (cold build)
        env: { RUN_LABEL: "run 1, cold" }
        run: spikes/network/run.sh
      - name: Run 2 (cleanup and subnet reuse)
        env: { RUN_LABEL: "run 2, warm" }
        run: spikes/network/run.sh
      - name: Run 3 (subnet taken by another network)
        env: { RUN_LABEL: "run 3, 10.213.0.0/23 taken" }
        run: |
          docker network create --subnet 10.213.0.0/23 spike-blocker
          spikes/network/run.sh | tee run3.log
          grep -q 'chose 10.213.2.0/24' run3.log
      - name: Leftovers
        if: always()
        run: docker ps -a; docker network ls
