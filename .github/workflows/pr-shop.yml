# Runs on PRs into main that touch the shop (or this file).
name: pr-shop

on:
  pull_request:
    branches: [main]
    paths: [examples/shop/**, .github/workflows/pr-shop.yml]

defaults:
  run:
    working-directory: examples/shop

jobs:
  shop-test:
    name: shop test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/shop/go.mod
          cache: false
      # Tests that need Postgres start it themselves (dbtest, testcontainers).
      - run: go test -race -count=1 ./...

  # Every shop service's Dockerfile builds. Whether the images run is checked
  # by compose, once the whole system is in.
  shop-images:
    name: shop images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every service image
        run: |
          for f in services/*/Dockerfile; do
            svc=$(basename "$(dirname "$f")")
            echo "::group::$svc"
            docker build -f "$f" -t "shop-$svc" . || { echo "::error title=docker build::$svc failed"; exit 1; }
            echo "::endgroup::"
          done
