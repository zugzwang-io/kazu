name: spike-noise

on:
  push:
    branches: [spike-noise]
  workflow_dispatch:

jobs:
  noise:
    name: noise (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: rate50-pause, rate: "50", fault: "1" }
          - { label: rate150-pause, rate: "150", fault: "1" }
          - { label: rate150-nofault, rate: "150", fault: "0" }
    steps:
      - uses: actions/checkout@v4
      - name: Run shop N times
        env: { N: "20", RATE: "${{ matrix.rate }}", FAULT: "${{ matrix.fault }}", DURATION: 60s, OUT: out }
        run: spikes/noise/run.sh
      - name: Analyze
        if: always()
        run: python3 spikes/noise/analyze.py out "${{ matrix.label }}" out/noise.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noise-${{ matrix.label }}
          path: out/
