name: spike-noise

on:
  push:
    branches: [spike-noise]
  workflow_dispatch:

jobs:
  noise:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Run shop N times
        env: { N: "20", RATE: "50", DURATION: 60s, OUT: out }
        run: spikes/noise/run.sh
      - name: Analyze
        if: always()
        run: |
          echo "## Runner ${{ matrix.runner }}" >> "$GITHUB_STEP_SUMMARY"
          python3 spikes/noise/analyze.py out out/noise.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noise-${{ matrix.runner }}
          path: out/
