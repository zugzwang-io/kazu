# The shop's own checks, with no Kazu involved.
name: shop

on:
  pull_request:
    branches: [main]
    paths: [examples/shop/**, .github/workflows/shop.yml]

defaults:
  run:
    working-directory: examples/shop

jobs:
  shop-test:
    name: shop test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/shop/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet -tags image ./...
      - run: go test -race -count=1 ./...

  # Each service's real image, built and run in a container per test
  # (internal/imagetest), with real requests against it.
  shop-images:
    name: shop images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/shop/go.mod
          cache: false
      - run: go test -tags image -run TestImage -count=1 -timeout 15m -v ./...
